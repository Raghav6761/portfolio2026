name: Deploy raghavwatts.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/raghavwatts.com

            # Pull latest (or clone first time)
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/Raghav6761/portfolio2026.git .
            fi

            # Install + build
            npm ci
            NODE_OPTIONS="--max_old_space_size=768" npm run build

            echo "Deployed successfully!"